# Keep Bevy's large build output OUT of the OneDrive-synced project folder.
# `target/` grows to many GB; letting OneDrive sync it is slow and causes
# intermittent file-lock build failures. Same pattern as `the portals`.
#
# Machine-specific path: adjust if you move the project or change users.
[build]
target-dir = "C:/Users/meman/cargo-targets/aetherfall"

# rust-lld ships with the Rust toolchain and links Bevy much faster than
# MSVC link.exe.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# The target dir lives outside the project, so pin the asset root (Bevy reads
# BEVY_ASSET_ROOT; so does our content loader) for cargo-launched runs.
[env]
BEVY_ASSET_ROOT = { value = ".", relative = true }
